name: Date digit diagnosis

on:
  push:
    branches: [diagnose/date-digit-line-ownership]

permissions:
  contents: read

jobs:
  wasm:
    name: WASM (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream
            ref: 0c9e28a481e662ff3b1823cfb1814084a13eb58b
          - name: pr7161
            ref: 68af356c36147e3a4c38c6e2caef52157e5958bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edwardkim/rhwp
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-pack
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Build WASM
        run: |
          wasm-pack build --target web --release
          git rev-parse HEAD > pkg/SOURCE_COMMIT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: date-digit-${{ matrix.name }}
          path: pkg/
          retention-days: 7
